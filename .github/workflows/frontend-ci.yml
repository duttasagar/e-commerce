name: Online Store Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'online-store-frontend/**'
      - '.github/workflows/frontend-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'online-store-frontend/**'
      - '.github/workflows/frontend-ci.yml'

  workflow_dispatch:

jobs:
  test:
    name: Test and Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: online-store-frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: online-store-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm run test:run

      - name: Run lint
        run: npm run lint

      - name: Build production frontend
        run: npm run build
